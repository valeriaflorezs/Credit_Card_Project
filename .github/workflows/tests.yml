# Integración continua (Entregable 3, sección 7.4): en cada push y pull request
# instala las dependencias y ejecuta las pruebas unitarias del modelo original.
name: Pruebas del modelo original

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias del modelo y las pruebas
        run: pip install numpy==2.5.3 scikit-learn==1.9.1 joblib==1.6.0 pytest
      - name: Ejecutar pytest
        run: python -m pytest tests/ -q
