# Integración continua (Entregable 3, sección 7.4): en cada push y pull request
# instala requirements.txt con Python 3.13 (la versión de los artefactos) y ejecuta las pruebas del modelo original y de los artefactos.
name: Pruebas del modelo original

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # Se instala requirements.txt completo para que el CI use exactamente las mismas versiones
      # que el proyecto (y que los artefactos serializados) y no se desactualice al cambiarlas.
      - name: Instalar dependencias del proyecto (requirements.txt)
        run: pip install -r requirements.txt
      - name: Ejecutar pytest
        run: python -m pytest tests/ -q
