title: "Predicción del Incumplimiento de Pago en Tarjetas de Crédito usando Machine Learning"
author: "Katherin Barrera López y Valeria Florez Sarmiento"
logo: ""
copyright: "2026"

# Los notebooks ya se ejecutan y versionan con sus salidas;
# el book solo los renderiza, no los vuelve a correr.
execute:
  execute_notebooks: "off"

bibtex_bibfiles:
  - references.bib

html:
  use_repository_button: false
  use_issues_button: false

sphinx:
  config:
    html_static_path: ["_static"]
    html_css_files: ["dash_theme.css"]

parse:
  myst_enable_extensions:
    - dollarmath
    - colon_fence

# Exclusión explícita de carpetas de datos, scripts, logs y temporales
exclude_patterns:
  - ".venv/**"
  - "data/**"
  - "logs/**"
  - "results/**"
  - "src/**"
  - ".git/**"
  - "EXPERIMENT_STATUS.md"
  - "experiments/**"
  - "**.ipynb_checkpoints"
  - "PROJECT_BRIEF.md"