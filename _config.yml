title: "Predicción del Incumplimiento de Pago en Tarjetas de Crédito usando Machine Learning"
author: "Katherin Barrera López y Valeria Florez Sarmiento"
logo: ""
copyright: "2026"

# Los notebooks ya se ejecutan y versionan con sus salidas;
# el book solo los renderiza, no los vuelve a correr.
execute:
  execute_notebooks: "off"

bibtex_bibfiles:
  - references.bib

html:
  use_repository_button: false
  use_issues_button: false

sphinx:
  config:
    html_static_path: ["_static"]
    html_css_files: ["dash_theme.css"]
    html_js_files: ["menu_plegable.js"]
    nb_output_stderr: "remove"

parse:
  myst_enable_extensions:
    - dollarmath
    - colon_fence

# Exclusión explícita de carpetas de datos, scripts, logs y temporales
exclude_patterns:
  - ".pytest_cache/**"
  - ".venv/**"
  - "data/**"
  - "logs/**"
  - "results/**"
  - "src/**"
  - "notebooks/legacy/**"          # corrida preliminar 3 x 3, solo como registro
  - "notebooks/07_svm_gpu_colab.ipynb"
  - "notebooks/12_colab_5x5.ipynb"
  - "notebooks/13_implementacion_entregable3.ipynb"   # se entrega aparte, como .ipynb ejecutado
  - ".git/**"
  - "EXPERIMENT_STATUS.md"
  - "experiments/**"
  - "**.ipynb_checkpoints"
  - "PROJECT_BRIEF.md"
  - "README.md"
  - "EXPERIMENT_STATUS.md"
  - "experiments/**"
  - "tests/**"
  - "artifacts/**"
  - ".github/**"