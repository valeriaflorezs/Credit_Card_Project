title: "Default of Credit Card Clients — Pipeline de Clasificación"
author: "Katherin Barrera López y Valeria Florez Sarmiento"
logo: ""

# Los notebooks ya se ejecutan y versionan con sus salidas —
# el book solo los renderiza, no los vuelve a correr.
execute:
  execute_notebooks: "off"

bibtex_bibfiles:
  - references.bib

html:
  use_repository_button: false
  use_issues_button: false

parse:
  myst_enable_extensions:
    - dollarmath
    - colon_fence

# Exclusión explícita de carpetas de datos, scripts, logs y temporales
exclude_patterns:
  - ".venv/**"
  - "data/**"
  - "logs/**"
  - "results/**"
  - "src/**"
  - ".git/**"
  - "**.ipynb_checkpoints"
  - "PROJECT_BRIEF.md"